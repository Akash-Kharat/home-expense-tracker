version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: home_expense_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: home_expense_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d home_expense_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
